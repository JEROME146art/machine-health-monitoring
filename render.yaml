# One-click deployment blueprint for Render.
# 1. Push the repository to GitHub.
# 2. In Render choose "New" -> "Blueprint" and select this repository.
# 3. Render detects render.yaml and deploys automatically.
#
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: machine-health-monitoring
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENABLE_SIMULATION
        value: "true"
      - key: SIMULATION_INTERVAL
        value: "2.0"
      - key: RANDOM_SEED
        value: "42"
